# Pull requests run fast, targeted checks. The expensive full workspace and platform matrix
# remains available through workflow_dispatch before a release or a merge that needs it.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      WOW_DATA: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: doc-links
        run: scripts/doc-links.py
      - name: message-catalog
        run: scripts/gen-message-catalog.py --check
      - name: pass-span-lint
        run: scripts/pass-span-lint.py
      # The Gamepad Lua bridge lives in benilla-ui; test that crate instead of compiling the
      # Bevy player and every asset/format crate for each small controller iteration.
      - name: gamepad Lua bridge tests
        run: cargo test -p benilla-ui --lib script::gamepad::tests

  full-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      WOW_DATA: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: fork addon smoke tests
        run: python3 scripts/check-fork-addons.py
      - name: doc-links
        run: scripts/doc-links.py
      - name: message-catalog
        run: scripts/gen-message-catalog.py --check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: samwhosung/benilla-re
          path: benilla-re
          fetch-depth: 0
      - name: reference
        run: scripts/sync-reference.py benilla-re --check
      - name: pass-span-lint
        run: scripts/pass-span-lint.py
      - name: player-clippy
        run: cargo clippy -p benilla -p benilla-app --no-default-features -- -D warnings
      - name: player-tests
        run: cargo test -p benilla-formats -p benilla-app --no-default-features --lib

  full-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      WOW_DATA: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: test
        run: cargo test --workspace --no-fail-fast
      - name: name the test a crash took down
        if: failure()
        run: cargo test --workspace --no-fail-fast -- --test-threads=1
      - name: player stack
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo build -p benilla --no-default-features
          $b = [IO.File]::ReadAllBytes("target\debug\benilla.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $reserve = [BitConverter]::ToUInt64($b, $pe + 24 + 72)
          "SizeOfStackReserve: $reserve"
          if ($reserve -lt 8MB) { exit 1 }
