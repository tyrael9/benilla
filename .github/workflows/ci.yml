# A single fast compile gate for the macOS development target.
# No tests, lint, packaging, or cross-platform jobs run on pull-request updates.
name: macOS compile check

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR replaces the stale compile instead of queuing another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-compile:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install project Rust toolchain
        run: rustup toolchain install && rustc -V
      - name: Setup compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Same package and default features as the local release run.
      - name: Compile macOS app (default features)
        run: cargo check --release -p benilla
      # This system is registered from the input-record dispatcher at runtime. Keep
      # its custom disjoint SystemParam access check under test, not just type checking.
      - name: Test input system parameter access
        run: cargo test --release --no-default-features -p benilla-app --lib ui_script::input::tests::input_feed_system_has_disjoint_primary_window_access_for_click_tracing
      # The iOS-specific bootstrap and state paths are cfg-gated and are invisible to
      # the desktop build above, so type-check the actual player target as well.
      - name: Install iOS Rust target
        run: rustup target add aarch64-apple-ios
      - name: Compile iOS player (no default features)
        run: cargo check --release --no-default-features -p benilla --target aarch64-apple-ios
      - name: Show compiler cache stats
        run: sccache --show-stats
